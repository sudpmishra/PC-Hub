[package]
name = "pc-hub"
version = "0.1.0"
edition = "2021"
description = "A touch dashboard for a small secondary screen"
license = "MIT"

[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }
sysinfo = "0.38"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.13"
raw-window-handle = "0.6"
# Needed by windows' #[interface] macro (used for switching the audio output).
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
