[package]
name = "pc-hub"
version = "0.1.0"
edition = "2021"
description = "A touch dashboard for a small secondary screen"
license = "MIT"

[dependencies]
# unstable-winit-030 gives access to the winit window: files dropped on the hub, and the
# list of screens. Its API may change between minor releases, so stay on 1.16.x.
slint = { version = "~1.16", features = ["raw-window-handle-06", "unstable-winit-030"] }
sysinfo = "0.38"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
# Rewrites hub.toml (reordering tiles) without losing its comments.
toml_edit = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Web request tiles and the weather.
ureq = { version = "3", features = ["json"] }
serde_json = "1"
# OBS Studio's WebSocket server, and its password check.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.13"
raw-window-handle = "0.6"
# The icon in the notification area, with Show, Restart and Quit.
tray-icon = "0.26"
# Needed by windows' #[interface] macro (used for switching the audio output).
windows-core = "0.62"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
